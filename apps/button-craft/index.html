<!doctype html>
<html lang="pl" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ButtonCraft UI Library</title>
        <link rel="stylesheet" href="src/utils/variables.css" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: var(--bc-font-family, "Inter", sans-serif);
                background: var(--bc-bg);
                color: var(--bc-text);
                text-align: center;
                padding: 2rem;
            }
            h1 {
                font-size: clamp(2rem, 5vw, 3.5rem);
                margin: 0 0 1rem;
                background: linear-gradient(
                    135deg,
                    var(--bc-color-primary),
                    var(--bc-color-secondary)
                );
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            p {
                color: var(--bc-text-secondary);
                max-width: 540px;
                line-height: 1.7;
                margin: 0 auto 2rem;
            }
            .links {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .links a {
                display: inline-block;
                padding: 0.75rem 2rem;
                border-radius: var(--bc-radius-full);
                text-decoration: none;
                font-weight: 600;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
            }
            .links a:hover {
                transform: translateY(-2px);
            }
            .links .primary {
                background: linear-gradient(
                    135deg,
                    var(--bc-color-primary),
                    var(--bc-color-secondary)
                );
                color: #fff;
                box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            }
            .links .secondary {
                border: 2px solid var(--bc-border);
                color: var(--bc-text);
            }
            footer {
                margin-top: 4rem;
                font-size: 0.8rem;
                color: var(--bc-text-muted);
            }
            footer a {
                color: var(--bc-color-primary);
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <h1>🎨 ButtonCraft UI Library</h1>
        <p>
            Modułowa kolekcja przycisków, komponentów i animacji CSS/JS — gotowa
            do użycia, łatwa w integracji, w pełni konfigurowalna.
        </p>
        <div class="links">
            <a class="primary" href="demo/index.html">Otwórz demo →</a>
            <a
                class="secondary"
                href="https://github.com/0xR3TRO/ButtonCraft"
                target="_blank"
                >GitHub</a
            >
        </div>
        <footer>
            &copy; 2026 <a href="https://github.com/0xR3TRO">0xR3TRO</a> — MIT
            License
        </footer>
        <script src="../../shared/back.js" defer></script>
    </body>
</html>
