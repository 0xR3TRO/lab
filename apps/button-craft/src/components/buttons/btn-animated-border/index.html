<!doctype html>
<html lang="pl" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ButtonCraft — Animated Border Buttons</title>
        <link rel="stylesheet" href="../../../utils/variables.css" />
        <link rel="stylesheet" href="btn-animated-border.css" />
        <style>
            body {
                font-family: var(--bc-font-family, sans-serif);
                background: var(--bc-bg);
                color: var(--bc-text);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                gap: 2rem;
            }
            .demo-row {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <h1>🔲 Animated Border Buttons</h1>
        <p>Obracający się gradient na obramowaniu przycisku.</p>

        <div class="demo-row">
            <button class="btn-border-anim">Rotating border</button>
            <button class="btn-border-anim btn-border-anim--pulse">
                Pulse
            </button>
            <button class="btn-border-anim btn-border-anim--thick">
                Thick
            </button>
            <button class="btn-border-anim btn-border-anim--pill">Pill</button>
        </div>

        <script src="btn-animated-border.js"></script>
    </body>
</html>
