<!doctype html>
<html lang="pl" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ButtonCraft — Ripple Buttons</title>
        <link rel="stylesheet" href="../../../utils/variables.css" />
        <link rel="stylesheet" href="btn-ripple.css" />
        <style>
            body {
                font-family: var(--bc-font-family, sans-serif);
                background: var(--bc-bg);
                color: var(--bc-text);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                gap: 2rem;
            }
            .demo-row {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <h1>🌊 Ripple Buttons</h1>
        <p>Kliknij przycisk — efekt fali (ripple) Material Design.</p>

        <div class="demo-row">
            <button class="btn-ripple">Primary</button>
            <button class="btn-ripple btn-ripple--secondary">Secondary</button>
            <button class="btn-ripple btn-ripple--success">Success</button>
            <button class="btn-ripple btn-ripple--danger">Danger</button>
            <button class="btn-ripple btn-ripple--outline">Outline</button>
        </div>

        <div class="demo-row">
            <button class="btn-ripple btn-ripple--sm">Small</button>
            <button class="btn-ripple btn-ripple--pill">Pill</button>
            <button class="btn-ripple btn-ripple--lg">Large</button>
        </div>

        <script src="btn-ripple.js"></script>
    </body>
</html>
