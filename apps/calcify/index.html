<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Calcify — a modern, lightweight browser calculator built with pure HTML, CSS, and JavaScript."
        />
        <title>Calcify</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    </head>
    <body>
        <div class="app">
            <!-- Header -->
            <header class="header">
                <h1 class="header__title">Calcify</h1>
                <button
                    class="theme-toggle"
                    id="themeToggle"
                    aria-label="Toggle dark mode"
                >
                    <span class="theme-toggle__icon" id="themeIcon"
                        >&#9790;</span
                    >
                </button>
            </header>

            <!-- Calculator -->
            <main class="calculator">
                <!-- Display -->
                <div class="display">
                    <div class="display__equation" id="equation">&nbsp;</div>
                    <div class="display__value" id="displayValue">0</div>
                </div>

                <!-- Button Grid -->
                <div class="buttons">
                    <button class="btn btn--action" data-action="clear">
                        C
                    </button>
                    <button class="btn btn--action" data-action="delete">
                        DEL
                    </button>
                    <button class="btn btn--operator" data-operator="÷">
                        ÷
                    </button>
                    <button class="btn btn--operator" data-operator="×">
                        ×
                    </button>

                    <button class="btn" data-digit="7">7</button>
                    <button class="btn" data-digit="8">8</button>
                    <button class="btn" data-digit="9">9</button>
                    <button class="btn btn--operator" data-operator="−">
                        −
                    </button>

                    <button class="btn" data-digit="4">4</button>
                    <button class="btn" data-digit="5">5</button>
                    <button class="btn" data-digit="6">6</button>
                    <button class="btn btn--operator" data-operator="+">
                        +
                    </button>

                    <button class="btn" data-digit="1">1</button>
                    <button class="btn" data-digit="2">2</button>
                    <button class="btn" data-digit="3">3</button>
                    <button
                        class="btn btn--equals"
                        data-action="equals"
                        rowspan="2"
                    >
                        =
                    </button>

                    <button class="btn btn--zero" data-digit="0">0</button>
                    <button class="btn" data-digit=".">.</button>
                </div>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <p>
                    Calcify &mdash; open-source calculator &middot;
                    <a
                        href="https://github.com/0xR3TRO/Calcify"
                        target="_blank"
                        rel="noopener noreferrer"
                        >GitHub</a
                    >
                </p>
            </footer>
        </div>

        <script src="script.js"></script>
        <script src="../../shared/back.js" defer></script>
    </body>
</html>
