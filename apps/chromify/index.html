<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chromify PRO — Advanced Color Palette Generator</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>"
        />
    </head>
    <body>
        <!-- ===== HEADER / TOOLBAR ===== -->
        <header class="toolbar">
            <div class="toolbar__left">
                <h1 class="logo">
                    Chromify <span class="logo__pro">PRO</span>
                </h1>
            </div>
            <div class="toolbar__center">
                <button
                    id="btn-generate"
                    class="btn btn--primary"
                    title="Generate palette (Space)"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M23 4l-6 6" />
                        <path d="M17 4h6v6" />
                        <path d="M1 20l6-6" />
                        <path d="M7 20H1v-6" />
                    </svg>
                    Generate
                </button>
                <button
                    id="btn-harmony"
                    class="btn btn--outline"
                    title="AI Harmony Suggestions"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="10" />
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                        />
                    </svg>
                    AI Suggest
                </button>
                <button
                    id="btn-gradient"
                    class="btn btn--outline"
                    title="Gradient Generator"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect x="2" y="2" width="20" height="20" rx="2" />
                        <line x1="2" y1="12" x2="22" y2="12" />
                    </svg>
                    Gradients
                </button>
                <button
                    id="btn-contrast"
                    class="btn btn--outline"
                    title="WCAG Contrast Checker"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 2v20" />
                        <path d="M12 2a10 10 0 0 1 0 20" />
                    </svg>
                    Contrast
                </button>
            </div>
            <div class="toolbar__right">
                <button
                    id="btn-history"
                    class="btn btn--icon"
                    title="Palette History"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </button>
                <button
                    id="btn-import"
                    class="btn btn--icon"
                    title="Import Palette JSON"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                </button>
                <button
                    id="btn-export"
                    class="btn btn--icon"
                    title="Export Palette JSON"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                </button>
                <button
                    id="btn-save"
                    class="btn btn--icon"
                    title="Save Palette"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                        />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                </button>
                <button
                    id="btn-theme"
                    class="btn btn--icon"
                    title="Toggle Light/Dark"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- ===== MAIN PALETTE AREA ===== -->
        <main id="palette-container" class="palette-container"></main>

        <!-- ===== TOAST ===== -->
        <div id="toast" class="toast" aria-live="polite"></div>

        <!-- ===== SIDEBAR: HISTORY ===== -->
        <aside id="sidebar-history" class="sidebar sidebar--right">
            <div class="sidebar__header">
                <h2>Palette History</h2>
                <button class="sidebar__close" data-close="sidebar-history">
                    &times;
                </button>
            </div>
            <div id="history-list" class="sidebar__body"></div>
            <div class="sidebar__footer">
                <button
                    id="btn-clear-history"
                    class="btn btn--danger btn--small"
                >
                    Clear All
                </button>
            </div>
        </aside>

        <!-- ===== MODAL: AI HARMONY ===== -->
        <div id="modal-harmony" class="modal">
            <div class="modal__backdrop" data-close="modal-harmony"></div>
            <div class="modal__content">
                <div class="modal__header">
                    <h2>AI Color Harmony</h2>
                    <button class="modal__close" data-close="modal-harmony">
                        &times;
                    </button>
                </div>
                <div class="modal__body">
                    <p class="modal__desc">
                        Generate palettes based on color harmony rules. Pick a
                        base color and a harmony type.
                    </p>
                    <div class="harmony-controls">
                        <label
                            >Base Color
                            <input
                                type="color"
                                id="harmony-base"
                                value="#6366f1"
                            />
                        </label>
                        <label
                            >Harmony
                            <select id="harmony-type">
                                <option value="analogous">Analogous</option>
                                <option value="complementary">
                                    Complementary
                                </option>
                                <option value="split-complementary">
                                    Split-Complementary
                                </option>
                                <option value="triadic">Triadic</option>
                                <option value="tetradic">Tetradic</option>
                                <option value="monochromatic">
                                    Monochromatic
                                </option>
                            </select>
                        </label>
                        <button id="btn-apply-harmony" class="btn btn--primary">
                            Generate Harmony
                        </button>
                    </div>
                    <div id="harmony-preview" class="harmony-preview"></div>
                </div>
            </div>
        </div>

        <!-- ===== MODAL: GRADIENT ===== -->
        <div id="modal-gradient" class="modal">
            <div class="modal__backdrop" data-close="modal-gradient"></div>
            <div class="modal__content modal__content--wide">
                <div class="modal__header">
                    <h2>Gradient Generator</h2>
                    <button class="modal__close" data-close="modal-gradient">
                        &times;
                    </button>
                </div>
                <div class="modal__body">
                    <div class="gradient-editor">
                        <div
                            id="gradient-preview"
                            class="gradient-preview"
                        ></div>
                        <div class="gradient-controls">
                            <label
                                >Type
                                <select id="gradient-type">
                                    <option value="linear">Linear</option>
                                    <option value="radial">Radial</option>
                                </select>
                            </label>
                            <label
                                >Angle (linear)
                                <input
                                    type="range"
                                    id="gradient-angle"
                                    min="0"
                                    max="360"
                                    value="90"
                                />
                                <span id="gradient-angle-val">90°</span>
                            </label>
                            <div
                                id="gradient-stops"
                                class="gradient-stops"
                            ></div>
                            <button
                                id="btn-add-stop"
                                class="btn btn--small btn--outline"
                            >
                                + Add Stop
                            </button>
                            <div class="gradient-css-output">
                                <label>CSS Output</label>
                                <code id="gradient-css"></code>
                                <button
                                    id="btn-copy-gradient"
                                    class="btn btn--small btn--primary"
                                >
                                    Copy CSS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== MODAL: CONTRAST ===== -->
        <div id="modal-contrast" class="modal">
            <div class="modal__backdrop" data-close="modal-contrast"></div>
            <div class="modal__content">
                <div class="modal__header">
                    <h2>WCAG Contrast Checker</h2>
                    <button class="modal__close" data-close="modal-contrast">
                        &times;
                    </button>
                </div>
                <div class="modal__body">
                    <div class="contrast-controls">
                        <label
                            >Foreground
                            <input
                                type="color"
                                id="contrast-fg"
                                value="#ffffff"
                            />
                        </label>
                        <label
                            >Background
                            <input
                                type="color"
                                id="contrast-bg"
                                value="#6366f1"
                            />
                        </label>
                    </div>
                    <div id="contrast-result" class="contrast-result"></div>
                    <div class="contrast-example">
                        <div
                            id="contrast-preview-box"
                            class="contrast-preview-box"
                        >
                            <span class="contrast-sample-large"
                                >Large Text (24px)</span
                            >
                            <span class="contrast-sample-normal"
                                >Normal Text (16px)</span
                            >
                        </div>
                    </div>
                    <button
                        id="btn-improve-palette"
                        class="btn btn--primary"
                        style="margin-top: 1rem; width: 100%"
                    >
                        Improve Palette (Auto Fix)
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== HIDDEN FILE INPUT ===== -->
        <input
            type="file"
            id="import-input"
            accept=".json"
            style="display: none"
        />

        <footer class="app-footer">
            <span
                >Press <kbd>Space</kbd> to generate &middot; Click color to copy
                &middot; Chromify PRO &copy; 2026</span
            >
        </footer>

        <script src="script.js"></script>
        <script src="../../shared/back.js" defer></script>
    </body>
</html>
