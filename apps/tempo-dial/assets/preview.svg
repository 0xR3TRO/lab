<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Clock -->
  <circle cx="600" cy="280" r="160" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="600" y1="280" x2="600" y2="170" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="600" y1="280" x2="680" y2="230" stroke="rgba(255,255,255,0.8)" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="300" x2="600" y2="140" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="600" cy="280" r="5" fill="white"/>
  <!-- Text -->
  <text x="600" y="510" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">TempoDial</text>
  <text x="600" y="555" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="20" font-weight="300">Modern Analog Clock Widget</text>
