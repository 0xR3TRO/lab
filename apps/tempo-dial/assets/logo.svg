<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="70" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Hour markers -->
  <line x1="100" y1="38" x2="100" y2="46" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="154" x2="100" y2="162" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="100" x2="46" y2="100" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
  <line x1="154" y1="100" x2="162" y2="100" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
  <!-- Hands -->
  <line x1="100" y1="100" x2="100" y2="58" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="130" y2="80" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="100" y2="48" stroke="#ff6b6b" stroke-width="1" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="3" fill="white"/>
</svg>
